[tab SETUP]
# PAD LEARN: tap it, then hit the pads you want for the sixteen sounds in the order BD, SD, LT, MT, HT, RS, CP, CB, CY, OH, CH, LC, MC, HC, CL, MA; it finishes after the sixteenth.
# CLEAR PADS goes back to General MIDI drum notes.
frame   x=16 y=96 w=1248 h=196 title="PADS"
toggle  cx=400 cy=180 label="PAD LEARN" key=learn bw=400
button  cx=880 cy=180 w=400 h=70 label="CLEAR PADS" key=pads_clear
readout cx=640 cy=257 w=1180 h=46 label="" key=pads_info tsize=19 tcolor=f6c13a
# MIDI LEARN: tap it (it stays lit), nudge a knob or fader on MACHINE or MIX,
# then move a control on the MIDI controller: that CC, on that channel, now
# moves it. Nudge another, or tap MIDI LEARN again to finish. CLEAR forgets
# the control nudged or learned last, CLEAR ALL every mapping. Mappings are
# saved with the project.
frame   x=16 y=300 w=1248 h=196 title="MIDI"
toggle  cx=400 cy=384 label="MIDI LEARN" key=midi_learn bw=400
button  cx=790 cy=384 w=300 h=70 label="CLEAR" key=midi_clear
button  cx=1100 cy=384 w=300 h=70 label="CLEAR ALL" key=midi_clear_all
readout cx=640 cy=461 w=1180 h=46 label="" key=midi_info tsize=19 tcolor=f6c13a
frame   x=16 y=504 w=1248 h=204 title="EXTRAS"
knob    cx=200 cy=594 r=44 label="VELOCITY" key=velocity bw=140 ns=20 vs=26
# The on/off extras (skin/skin_post.py draws them as keys).
toggle  cx=520 cy=604 label="HAT CHOKE" key=choke bw=240
