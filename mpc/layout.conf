knob    cx=363 cy=195 r=34 label="TONE" key=sd_tone bw=100 ns=0 vs=26 vy=20
knob    cx=363 cy=331 r=34 label="SNAPPY" key=sd_snappy bw=100 ns=0 vs=26 vy=20
knob    cx=363 cy=467 r=34 label="DECAY" key=sd_decay bw=100 ns=0 vs=26 vy=20
knob    cx=501 cy=195 r=34 label="TUNING" key=lt_tuning bw=100 ns=0 vs=26 vy=20
knob    cx=640 cy=195 r=34 label="TUNING" key=mt_tuning bw=100 ns=0 vs=26 vy=20
