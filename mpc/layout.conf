# BOOM8 for MPC OS touchscreens (MPC Live III and other 1280x800 units).
# Plugin area: x 0..1280, y 86..714 (tools/shadow_skin.py). Written by
# gen_layout.py; skin/skin_post.py paints the panel round these controls.
theme_bg=2c2c2e
theme_ink=ece4ce
theme_ink_dim=968f80
theme_accent=ee7e22
theme_accent_hi=f6c13a
theme_seg_active=ee7e22
theme_seg_inactive=2a2a2c
theme_seg_active_tx=1c1c1e
theme_lcd=0e0e0f
theme_knob_dot=d63428
theme_btn_on=d63428
qlinks_track = bd_tone,bd_decay,sd_tone,sd_snappy,sd_decay,cy_decay,bd_level,volume

[tab MACHINE]
# A column per instrument with its sound knobs top to bottom. The levels
# are on MIX; the pads play the sounds.
knob    cx=85 cy=195 r=34 label="ACCENT" key=accent bw=100 ns=0 vs=26 vy=20
knob    cx=224 cy=195 r=34 label="TUNE" key=bd_tune bw=100 ns=0 vs=26 vy=20
knob    cx=224 cy=331 r=34 label="TONE" key=bd_tone bw=100 ns=0 vs=26 vy=20
