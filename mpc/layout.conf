# BOOM8 for MPC OS touchscreens (MPC Live III and other 1280x800 units).
# Plugin area: x 0..1280, y 86..714 (tools/shadow_skin.py). Written by
# gen_layout.py; skin/skin_post.py paints the panel round these controls.
theme_bg=1c1c1e
theme_ink=f1ead8
theme_ink_dim=b9b1a0
theme_accent=f08a24
theme_accent_hi=f6c13a
theme_seg_active=f08a24
theme_seg_inactive=2a2a2c
theme_seg_active_tx=1c1c1e
theme_lcd=0e0e0f
theme_knob_dot=e8402a
theme_btn_on=e8402a
qlinks_track = bd_level,bd_tone,bd_decay,sd_tone,sd_snappy,cy_decay,oh_decay,volume

[tab MACHINE]
# Thirteen columns as on the hardware's panel: ACCENT, the eleven instruments
# (the tom, rim shot and clap columns also set the congas, claves and
# maracas), and the master VOLUME. The keys below play the sixteen sounds.
knob    cx=64 cy=199 r=32 label="LEVEL" key=accent bw=92 ns=14 vs=18
knob    cx=160 cy=199 r=32 label="LEVEL" key=bd_level bw=92 ns=14 vs=18
knob    cx=160 cy=333 r=32 label="TONE" key=bd_tone bw=92 ns=14 vs=18
knob    cx=160 cy=467 r=32 label="DECAY" key=bd_decay bw=92 ns=14 vs=18
knob    cx=256 cy=199 r=32 label="LEVEL" key=sd_level bw=92 ns=14 vs=18
knob    cx=256 cy=333 r=32 label="TONE" key=sd_tone bw=92 ns=14 vs=18
knob    cx=256 cy=467 r=32 label="SNAPPY" key=sd_snappy bw=92 ns=14 vs=18
knob    cx=352 cy=199 r=32 label="LEVEL" key=lt_level bw=92 ns=14 vs=18
knob    cx=352 cy=333 r=32 label="TUNING" key=lt_tuning bw=92 ns=14 vs=18
knob    cx=448 cy=199 r=32 label="LEVEL" key=mt_level bw=92 ns=14 vs=18
knob    cx=448 cy=333 r=32 label="TUNING" key=mt_tuning bw=92 ns=14 vs=18
knob    cx=544 cy=199 r=32 label="LEVEL" key=ht_level bw=92 ns=14 vs=18
knob    cx=544 cy=333 r=32 label="TUNING" key=ht_tuning bw=92 ns=14 vs=18
knob    cx=640 cy=199 r=32 label="LEVEL" key=rs_level bw=92 ns=14 vs=18
knob    cx=736 cy=199 r=32 label="LEVEL" key=cp_level bw=92 ns=14 vs=18
knob    cx=832 cy=199 r=32 label="LEVEL" key=cb_level bw=92 ns=14 vs=18
knob    cx=928 cy=199 r=32 label="LEVEL" key=cy_level bw=92 ns=14 vs=18
knob    cx=928 cy=333 r=32 label="TONE" key=cy_tone bw=92 ns=14 vs=18
knob    cx=928 cy=467 r=32 label="DECAY" key=cy_decay bw=92 ns=14 vs=18
knob    cx=1024 cy=199 r=32 label="LEVEL" key=oh_level bw=92 ns=14 vs=18
knob    cx=1024 cy=333 r=32 label="DECAY" key=oh_decay bw=92 ns=14 vs=18
knob    cx=1120 cy=199 r=32 label="LEVEL" key=ch_level bw=92 ns=14 vs=18
knob    cx=1216 cy=199 r=32 label="MASTER" key=volume bw=92 ns=14 vs=18
button  cx=55 cy=620 w=72 h=76 label="BD" key=hit_bd
button  cx=133 cy=620 w=72 h=76 label="SD" key=hit_sd
button  cx=211 cy=620 w=72 h=76 label="LT" key=hit_lt
button  cx=289 cy=620 w=72 h=76 label="MT" key=hit_mt
button  cx=367 cy=620 w=72 h=76 label="HT" key=hit_ht
button  cx=445 cy=620 w=72 h=76 label="RS" key=hit_rs
button  cx=523 cy=620 w=72 h=76 label="CP" key=hit_cp
button  cx=601 cy=620 w=72 h=76 label="CB" key=hit_cb
button  cx=679 cy=620 w=72 h=76 label="CY" key=hit_cy
button  cx=757 cy=620 w=72 h=76 label="OH" key=hit_oh
button  cx=835 cy=620 w=72 h=76 label="CH" key=hit_ch
button  cx=913 cy=620 w=72 h=76 label="LC" key=hit_lc
button  cx=991 cy=620 w=72 h=76 label="MC" key=hit_mc
