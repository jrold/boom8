qlinks "DRUMS" = bd_level,bd_tone,bd_decay,sd_level,sd_tone,sd_snappy,accent,volume
qlinks "TOMS" = lt_level,lt_tuning,mt_level,mt_tuning,ht_level,ht_tuning,rs_level,cp_level
qlinks "METAL" = cb_level,cy_level,cy_tone,cy_decay,oh_level,oh_decay,ch_level,volume

[tab SETUP]
# PAD LEARN: tap it, then hit the pads you want for the sixteen sounds in the
# order of the instrument keys (BD to MA); it finishes after the sixteenth.
# CLEAR PADS goes back to General MIDI drum notes.
frame   x=16 y=96 w=1248 h=300 title="PADS"
toggle  cx=400 cy=230 label="PAD LEARN" key=learn bw=400
button  cx=880 cy=230 w=400 h=90 label="CLEAR PADS" key=pads_clear
readout cx=640 cy=330 w=1180 h=52 label="" key=pads_info tsize=19 tcolor=f6c13a
frame   x=16 y=412 w=1248 h=296 title="EXTRAS"
knob    cx=200 cy=560 r=54 label="VELOCITY" key=velocity bw=140 ns=20 vs=26
knob    cx=420 cy=560 r=54 label="BD TUNE" key=bd_tune bw=140 ns=20 vs=26
# HAT CHOKE: the closed hat cuts the open hat (skin/skin_post.py draws the key).
toggle  cx=700 cy=560 label="HAT CHOKE" key=choke bw=240
